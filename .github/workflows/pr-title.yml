name: pr-title

on:
  pull_request:
    branches: [development, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The title check and the branch-type label share one job: each job is billed as at least a whole minute.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write   # labels
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^(feat|fix|hotfix|test|docs|refactor|perf|build|ci|chore|revert)\((catalog|staff|borrowing|notifications|reporting|shared|db|api|infra|docs|ci)\)!?: .{5,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must look like: type(scope): summary (REQ-ID), for example: feat(staff): add CanBorrowAsync (MEM-05)"
            exit 1
          fi
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|test)'; then
            if ! printf '%s\n%s' "$TITLE" "$BODY" | grep -Eq '\b(CAT|MEM|BOR|NOT|REP|NFR|INT)-[0-9]{2}\b|\bBR-[A-Z]+-[0-9]+\b'; then
              echo "::error::feat, fix and test pull requests must name a requirement ID (for example BOR-04) in the title or description"
              exit 1
            fi
          fi

      # pr-labels: labels the pull request by its branch type (.github/labeler.yml), also when the title is wrong.
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        with:
          sparse-checkout: .github
      - uses: actions/labeler@v5
        if: ${{ !cancelled() }}
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
