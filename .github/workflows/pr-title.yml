name: pr-title

on:
  pull_request:
    branches: [development, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^(feat|fix|hotfix|test|docs|refactor|perf|build|ci|chore|revert)[(](catalog|staff|borrowing|notifications|reporting|shared|db|api|infra|docs|ci)[)]!? :[[:space:]].{5,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must look like: type(scope): summary (REQ-ID), for example: feat(staff): add CanBorrowAsync (MEM-05)"
            exit 1
          fi