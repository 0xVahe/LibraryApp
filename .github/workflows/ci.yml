name: ci

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^(feat|fix|hotfix|test|docs|refactor|perf|build|ci|chore|revert)\((catalog|staff|borrowing|notifications|reporting|shared|db|api|infra|docs|ci)\)!?: .{5,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must look like: type(scope): summary (REQ-ID), for example: feat(staff): add CanBorrowAsync (MEM-05)"
            exit 1
          fi
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|test)'; then
            if ! printf '%s\n%s' "$TITLE" "$BODY" | grep -Eq '\b(CAT|MEM|BOR|NOT|REP|NFR|INT)-[0-9]{2}\b|\bBR-[A-Z]+-[0-9]+\b'; then
              echo "::error::feat, fix and test pull requests must name a requirement ID (for example BOR-04) in the title or description"
              exit 1
            fi
          fi

  build-and-test:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore LibraryApp.sln
      - run: dotnet build LibraryApp.sln --configuration Release --no-restore
      - name: Unit tests with coverage
        run: |
          dotnet test tests/LibraryApp.Domain.Tests --configuration Release --no-build \
            --collect:"XPlat Code Coverage" --results-directory ./coverage
          dotnet test tests/LibraryApp.Application.Tests --configuration Release --no-build \
            --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Coverage gate - Application at least 50% (NFR-09)
        if: ${{ vars.COVERAGE_GATE == 'true' }}
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          covered = total = 0
          for path in glob.glob('coverage/**/coverage.cobertura.xml', recursive=True):
              for package in ET.parse(path).getroot().iter('package'):
                  if package.get('name') == 'LibraryApp.Application':
                      for line in package.iter('line'):
                          total += 1
                          covered += 1 if int(line.get('hits')) > 0 else 0
          rate = 100.0 * covered / total if total else 0.0
          print(f'Application line coverage: {rate:.1f}% ({covered}/{total})')
          sys.exit(0 if rate >= 50.0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  model-sync:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: No pending model changes
        run: |
          if [ ! -f src/LibraryApp.Infrastructure/Persistence/LibraryDbContext.cs ]; then
            echo "LibraryDbContext does not exist yet - nothing to check."
            exit 0
          fi
          dotnet tool restore
          if ! dotnet ef migrations has-pending-model-changes --project src/LibraryApp.Infrastructure; then
            echo "::error::The model changed but there is no migration. Label the pull request needs-migration; the Integration Owner adds the migration as the last commit. Do not add migration files yourself."
            exit 1
          fi

  integration-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly_Throwaway_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly_Throwaway_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      LIBRARYAPP_TEST_DB: Server=localhost,1433;Database=LibraryApp_CiTests;User Id=sa;Password=CiOnly_Throwaway_Passw0rd;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore LibraryApp.sln
      - run: dotnet test tests/LibraryApp.Infrastructure.IntegrationTests --configuration Release --no-restore
      - run: dotnet test tests/LibraryApp.Api.IntegrationTests --configuration Release --no-restore

  secret-scan:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --no-banner
