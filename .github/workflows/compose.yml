name: compose

# NFR-13: the system as `docker compose up --build` starts it, checked from outside with the same smoke test as ci.yml.
# Building the image takes about two minutes, so this runs only when a file that shapes the container changes, after a
# merge into development or main, and once a day; it is not a required check.
on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/LibraryApp.Api/Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .env.sample
      - "**/*.csproj"
      - src/LibraryApp.Api/Program.cs
      - "src/LibraryApp.Api/appsettings*.json"
      - .github/scripts/smoke-test.sh
      - .github/workflows/compose.yml
  push:
    branches: [development, main]
  schedule:
    - cron: "30 3 * * *"   # 07:30 in Yerevan, on the default branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-smoke-test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The image docker compose would build, with its layers cached between runs.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/LibraryApp.Api/Dockerfile
          tags: libraryapp-api:latest
          load: true
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max
      - name: Settings for docker compose (.env)
        run: |
          # Throw-away values for this job only, generated as .env.sample asks.
          password="Ci$(openssl rand -hex 12)_9a!"
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$key"
          printf 'MSSQL_SA_PASSWORD=%s\nJWT_SIGNING_KEY=%s\n' "$password" "$key" > .env
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: docker compose up
        run: docker compose up -d --no-build --wait --wait-timeout 240
      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh http://localhost:8080 libraryapp-sqlserver "$MSSQL_SA_PASSWORD"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
